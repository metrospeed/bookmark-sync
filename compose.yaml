services:
  bookmarks:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN:?Set SYNC_TOKEN in .env}
    volumes:
      - bookmark-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  bookmark-data:
