services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BOOKMARK_DOMAIN: ${BOOKMARK_DOMAIN:?Set BOOKMARK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bookmarks
volumes:
  caddy-data:
  caddy-config:
